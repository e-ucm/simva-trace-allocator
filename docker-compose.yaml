version: '3'

networks:
  traefik_services:
    name: "${SIMVA_SERVICE_NETWORK:-traefik_services}"
    external: true
  kafka_services:
    name: "${SIMVA_KAFKA_NETWORK:-kafka_services}"
    external: true

services:
  simva-trace-allocator:
    build: ./
    command: [ "npm", "run", "dev" ]
    stdin_open: true
    tty: true
    environment:
      #DEBUG
      DEBUG: true
      #LOG
      LOG_LEVEL: debug
      LOG_FOLDER: /home/node/logs
      #NODE
      NODE_ENV: development
      #The stack issues its certificates from the local development CA, which is not
      #part of the Node.js trust store
      NODE_EXTRA_CA_CERTS: "/var/lib/simva/tls/ca/rootCA.pem"
      #TRACE ALLOCATOR
      CONCAT_EVENT_POLICY: true
      BATCH_SIZE: 100
      MAX_DELAY: 5min
      REFRESH_INTERVAL: 4h
      LOCAL_STATE: /data
      REMOTE_STATE: state
      REMOVE_DRY_RUN: true
      GC_INTERVAL: 2h
      COPY_INSTEAD_RENAME: true
      TRY_RECOVERY: true
      #MINIO / RUSTFS (internal endpoint: the external hostnames are only resolvable through the load balancer)
      MINIO_HOST: rustfs.internal.test
      MINIO_SSL: false
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: admin-rustfs
      MINIO_SECRET_KEY: password-rustfs
      MINIO_BUCKET: traces
      MINIO_TOPICS_DIR: kafka-topics
      MINIO_TRACES_TOPIC: traces
      MINIO_OUTPUTS_DIR: outputs
      MINIO_TRACES_FILE: traces.json
      #SIMVA API (read only service account, credentials generated by the Keycloak stack)
      SIMVA_HOST: simva-api.external.test
      SIMVA_PROTOCOL: https
      SIMVA_PORT: 443
      #KEYCLOAK (OAuth2 token endpoint used to authenticate against the SIMVA API)
      #Keycloak refuses plain HTTP, so it is always reached through the load balancer
      SIMVA_SSO_HOST: "${SIMVA_SSO_HOST_SUBDOMAIN:-sso}.${SIMVA_EXTERNAL_DOMAIN:-external.test}"
      SIMVA_SSO_PROTOCOL: "${SIMVA_EXTERNAL_PROTOCOL:-https}"
      SIMVA_SSO_PORT: "443"
      SIMVA_SSO_REALM: "${SIMVA_SSO_REALM:-simva}"
      SIMVA_CLIENT_ID: "${SIMVA_TRACE_ALLOCATOR_CLIENT_ID:-simva-trace-allocator}"
      SIMVA_CLIENT_SECRET: "${SIMVA_TRACE_ALLOCATOR_CLIENT_SECRET:-secret}"
      #OAuth2 resource owner: the read only garbagecollector user
      SIMVA_USER: "${SIMVA_GARBAGECOLLECTOR_USER:-garbagecollector}"
      SIMVA_PASSWORD: "${SIMVA_GARBAGECOLLECTOR_PASSWORD:-password}"
      SIMVA_WAIT_TIME: 10
      SIMVA_MAX_RETRIES: 20
      #KAFKA
      SIMVA_KAFKA_CLIENTID: simva_trace_allocator
      SIMVA_KAFKA_BROKER: kafka1.internal.test:9092
      SIMVA_KAFKA_GROUPID: simva_trace_allocator
      SIMVA_KAFKA_MINIO_TOPIC: minio-events
    hostname: simva-trace-allocator.internal.test
    volumes:
      - ./:/home/node/app
      - /home/node/app/node_modules #exclude node_modules
      - ${SIMVA_TLS_HOME?TLS home folder required}:/var/lib/simva/tls:ro
    networks:
      - traefik_services
      - kafka_services
