name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Syntax check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          set -euo pipefail
          find . -path ./node_modules -prune -o -name '*.js' -print | while read -r file; do
            node --check "$file"
          done

      - name: Test
        run: npm test

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          tags: simva-trace-allocator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
